<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Планировщик</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;height:100vh;display:flex;background:#fafafa}
aside{width:240px;border-right:1px solid #ddd;background:#f3f3f3;display:flex;flex-direction:column;padding:10px}
#new{padding:10px;border:none;border-radius:8px;background:#2d6cdf;color:#fff;font-size:15px;cursor:pointer;margin-bottom:10px}
#list{overflow-y:auto;flex:1}
.item{padding:8px;border-radius:6px;cursor:pointer;font-size:14px;margin-bottom:4px;word-break:break-word}
.item:hover{background:#e6e6e6}
.item.active{background:#fff;font-weight:600;box-shadow:0 0 0 1px #ccc}
main{flex:1;display:flex;flex-direction:column;padding:10px;min-width:0}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:4px 0;font-size:14px;color:#555}
#title{font-weight:600;color:#222;font-size:16px}
.tools button{background:none;border:1px solid #ccc;border-radius:6px;padding:4px 8px;margin-left:4px;cursor:pointer;font-size:13px}
.tools button:hover{background:#eee}
#chat{flex:1;overflow-y:auto;border:1px solid #ddd;border-radius:8px;padding:10px;background:#fff}
.msg{margin:8px 0;padding:8px 10px;border-radius:8px;white-space:pre-wrap;line-height:1.4}
.user{background:#dcf1ff;margin-left:20%}
.bot{background:#f1f1f1;margin-right:10%}
.event{font-size:12px;color:#777;font-family:monospace;white-space:pre-wrap;margin:2px 0}
form{display:flex;gap:8px;margin-top:8px}
textarea{flex:1;height:70px;font-size:16px;padding:8px;border-radius:8px;border:1px solid #ccc;resize:vertical}
#b{padding:0 18px;font-size:16px;border-radius:8px;border:none;background:#2d6cdf;color:#fff;cursor:pointer}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{padding:6px 9px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
.quick button:hover{background:#eee}
button:disabled,textarea:disabled{background:#999;opacity:.7}
.hint{font-size:12px;color:#888;margin-top:4px}
@media (max-width:640px){
  body{flex-direction:column;height:auto;min-height:100vh}
  aside{width:auto;border-right:none;border-bottom:1px solid #ddd;max-height:30vh}
  main{height:70vh}
}
</style></head><body>
<aside>
  <button id="new">+ Новый чат</button>
  <div id="list"></div>
</aside>
<main>
  <header>
    <span id="title"></span>
    <span class="tools">
      <button id="rename">Переименовать</button>
      <button id="clear">Очистить</button>
      <button id="delete">Удалить</button>
      <button id="board">Канбан-доска</button>
    </span>
  </header>
  <div id="chat"></div>
  <form id="f"><textarea id="t" placeholder="Напишите..."></textarea><button id="b">Отправить</button></form>
  <div class="quick" id="quick">
    <button data-command="show_subjects">Предметы</button>
    <button data-command="show_board">Доска</button>
    <button data-command="show_timetable">Расписание</button>
    <button data-command="deadlines">Дедлайны</button>
    <button data-command="show_goals">Цели</button>
    <button data-command="show_schedule">Режим</button>
    <button data-command="list_topics">Темы</button>
  </div>
  <div class="hint">Enter — отправить, Shift+Enter — новая строка. Команды: /неделя /месяц /итог /дедлайны /журнал</div>
</main>
<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), ta = $('t'), btn = $('b'), list = $('list');
let state = null;

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function addEvents(events) {
  (events || []).forEach(e => {
    const d = document.createElement('div');
    d.className = 'event';
    d.textContent = e;
    chat.appendChild(d);
  });
  chat.scrollTop = chat.scrollHeight;
}
function busy(flag) { btn.disabled = flag; ta.disabled = flag; }

async function api(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'},
                               body: JSON.stringify(body || {})});
  return r.json();
}

async function refresh() {
  state = await (await fetch('/state')).json();
  $('title').textContent = state.chat.title;
  chat.innerHTML = '';
  state.chat.messages.forEach(m => add(m.role, m.content));
  list.innerHTML = '';
  state.chats.forEach(c => {
    const d = document.createElement('div');
    d.className = 'item' + (c.id === state.chat.id ? ' active' : '');
    d.textContent = c.title + ' (' + c.count + ')';
    d.onclick = () => act('/chat/open', {id: c.id});
    list.appendChild(d);
  });
}

async function act(path, body) {
  try {
    const r = await api(path, body);
    if (r.error) alert(r.error);
    await refresh();
  } catch (e) {
    alert('Нет связи с сервером: ' + e);
  }
}

async function send() {
  const text = ta.value.trim();
  if (!text) return;
  ta.value = '';
  add('user', text);
  busy(true);
  try {
    const r = await api('/send', {text});
    if (r.error) alert(r.error);
    await refresh();
    addEvents(r.events);
  } catch (e) {
    alert('Нет связи с сервером: ' + e);
  } finally {
    busy(false);
    ta.focus();
  }
}

async function localCommand(name, button) {
  if (button) button.disabled = true;
  try {
    const r = await api('/command', {name});
    if (r.error) return alert(r.error);
    add('bot', r.result);
  } catch (e) {
    alert('Нет связи с сервером: ' + e);
  } finally {
    if (button) button.disabled = false;
  }
}

$('new').onclick = () => act('/chat/new');
$('clear').onclick = () => {
  if (confirm('Очистить историю этого чата? Задачи, цели и темы не удалятся.'))
    act('/chat/clear', {id: state.chat.id});
};
$('delete').onclick = () => {
  if (confirm('Удалить этот чат целиком?'))
    act('/chat/delete', {id: state.chat.id});
};
$('rename').onclick = () => {
  const t = prompt('Название чата', state.chat.title);
  if (t) act('/chat/rename', {id: state.chat.id, title: t});
};
$('board').onclick = () => { window.open('/board.html', '_blank'); };
$('quick').addEventListener('click', e => {
  const button = e.target.closest('button[data-command]');
  if (button) localCommand(button.dataset.command, button);
});
$('f').addEventListener('submit', e => { e.preventDefault(); send(); });
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

(async () => { await refresh(); ta.focus(); })();
</script></body></html>
